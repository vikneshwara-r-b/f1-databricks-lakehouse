# This is a Declarative Automation Bundle definition for f1_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: f1_analytics
  engine: direct


include:
  - resources/**/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: Describes which catalog to use
  raw_zone_schema_name:
    description: Raw zone Schema Name
  curated_zone_schema_name:
    description: Curated zone Schema Name
  raw_volume_name:
    description: Unity Catalog Raw Volume Name
  raw_volume_subdir_path:
    description: Unity Catalog Raw Volumn Sub Directory

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-0992b879-1b9c.cloud.databricks.com
    variables:
      catalog: workspace
      raw_zone_schema_name: raw
      curated_zone_schema_name: curated
      raw_volume_name: f1_api_export
      raw_volume_subdir_path: race_results_dumps
  prod:
    mode: production
    workspace:
      host: https://dbc-0992b879-1b9c.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/vikneshwararb@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/PROD/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      raw_zone_schema_name: raw
      curated_zone_schema_name: curated
      raw_volume_name: f1_api_export
      raw_volume_subdir_path: race_results_dumps
