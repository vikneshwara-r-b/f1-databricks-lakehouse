# The main pipeline for f1_analytics

resources:
  pipelines:
    f1_analytics_etl:
      name: f1_analytics_etl
      catalog: ${var.catalog}
      schema: ${resources.schemas.bronze_schema.name}
      serverless: true
      root_path: "../../src/transformations"

      libraries:
        - glob:
            include: ../../src/transformations/**
      
      configuration:
        volume_root_path: /Volumes/workspace/${resources.schemas.bronze_schema.name}/${var.raw_volume_name}
        volume_subdir_path: ${var.raw_volume_subdir_path}
