# Databricks Workflow Definition for Novacart use case study
resources:

  jobs:
    f1_ingest_and_transform_workflow:
      name: f1_ingest_and_transform_workflow
      
      # Job-level parameters (shared across all tasks)
      parameters:
        - name: f1_season_year
          default: current
        - name: f1_season_round
          default: last
        - name: f1_api_export_filename_prefix
          default: f1_api_export
        - name: volume_root_path
          default: ""
        - name: volume_subdir_path
          default: race_year_and_season_dumps
        - name: f1_api_base_url
          default: https://f1api.dev/api
      
      # Task definitions
      tasks:
        # Step 1: Execute Bronze ingestion notebook
        - task_key: extract_f1_data
          notebook_task:
            notebook_path: ../../src/ingestion/extract_f1_source_data.ipynb
            source: WORKSPACE
            base_parameters:
              f1_season_year: "{{job.parameters.f1_season_year}}"
              f1_season_round: "{{job.parameters.f1_season_round}}"
              f1_api_export_filename_prefix: "{{job.parameters.f1_api_export_filename_prefix}}"
              volume_root_path: /Volumes/${var.catalog}/${var.raw_zone_schema_name}/${var.raw_volume_name}
              volume_subdir_path: "{{job.parameters.volume_subdir_path}}"
              f1_api_base_url: "{{job.parameters.f1_api_base_url}}"

        # Step-2: Load F1 data into raw and prepared zone
        - task_key: load_f1_data_into_raw_and_prepared
          max_retries: 0
          min_retry_interval_millis: 0
          retry_on_timeout: false
          depends_on:
            - task_key: extract_f1_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.f1_load_to_prepared.id}
  
      # Timeout and retry configuration
      timeout_seconds: 0
      max_concurrent_runs: 1
