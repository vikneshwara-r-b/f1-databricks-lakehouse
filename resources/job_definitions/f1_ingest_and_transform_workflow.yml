# Databricks Workflow Definition for the F1 analytics use case study
resources:

  jobs:
    f1_ingest_and_transform_workflow:
      name: f1_ingest_and_transform_workflow
      
      # Job-level parameters (shared across all tasks)
      parameters:
        - name: f1_season_year
          default: 2024
        - name: f1_season_round
          default: 1
        - name: f1_api_export_filename_prefix
          default: f1_api_export
        - name: volume_root_path
          default: /Volumes/${var.catalog}/${resources.schemas.bronze_schema.name}/${var.raw_volume_name}
        - name: volume_subdir_path
          default: race_results_dumps
        - name: f1_api_base_url
          default: https://f1api.dev/api
      
      # Task definitions
      tasks:
        # Step 1: Execute Bronze ingestion notebook
        - task_key: extract_api
          notebook_task:
            notebook_path: ../../src/ingestion/extract_f1_source_data.ipynb
            source: WORKSPACE
            base_parameters:
              f1_season_year: "{{job.parameters.f1_season_year}}"
              f1_season_round: "{{job.parameters.f1_season_round}}"
              f1_api_export_filename_prefix: "{{job.parameters.f1_api_export_filename_prefix}}"
              volume_root_path: "{{job.parameters.volume_root_path}}"
              volume_subdir_path: "{{job.parameters.volume_subdir_path}}"
              f1_api_base_url: "{{job.parameters.f1_api_base_url}}"

        # Step-2: Load F1 data into raw and prepared zone
        - task_key: load_into_raw_and_prepared
          max_retries: 0
          min_retry_interval_millis: 0
          retry_on_timeout: false
          depends_on:
            - task_key: extract_api
          pipeline_task:
            pipeline_id: ${resources.pipelines.f1_load_to_prepared.id}

        # Step-3: Transform F1 data into curated zone
        - task_key: curated_zone_transform
          max_retries: 0
          min_retry_interval_millis: 0
          retry_on_timeout: false
          depends_on:
            - task_key: load_into_raw_and_prepared
          pipeline_task:
            pipeline_id: ${resources.pipelines.f1_curated_transformation.id}

        # Step-4: Transform F1 data into modelled zone
        - task_key: modelled_zone_transform
          max_retries: 0
          min_retry_interval_millis: 0
          retry_on_timeout: false
          depends_on:
            - task_key: curated_zone_transform
          pipeline_task:
            pipeline_id: ${resources.pipelines.f1_analytics_transformation.id}
  
      # Timeout and retry configuration
      timeout_seconds: 0
      max_concurrent_runs: 1
